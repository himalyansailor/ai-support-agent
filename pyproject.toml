[project]
name = "ai-support-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/core", "apps/api", "apps/worker", "apps/voice"]

[tool.uv.sources]
supportcore = { workspace = true }
supportapi = { workspace = true }
supportworker = { workspace = true }
supportvoice = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "supportcore", "supportapi", "supportworker", "supportvoice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/core/tests", "apps/api/tests", "apps/worker/tests", "apps/voice/tests"]
pythonpath = ["packages/core/src", "apps/api/src", "apps/worker/src", "apps/voice/src"]
markers = [
    "integration: needs external services (e.g. Mailpit); skips when they are not running",
    "models: downloads/runs real local models; skipped unless SUPPORT_RUN_MODEL_TESTS=1",
]
