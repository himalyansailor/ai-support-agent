[project]
name = "supportcore"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.118",
    "celery[redis]>=5.6.3",
    "chromadb-client>=1.5.9",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
    "imap-tools>=1.16.0",
    "langchain>=1",
    "langchain-anthropic>=1.7.6",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=4.18.0,<5",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "nh3>=0.3.7",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-celery>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-sdk>=1.45.1",
    "prometheus-client>=0.26.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "redis>=6.4.0",
    "sentence-transformers>=6.2.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "stripe>=16,<17",
    "structlog>=26.1.0",
    "twilio>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportcore"]
