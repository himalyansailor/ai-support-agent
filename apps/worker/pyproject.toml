[project]
name = "supportworker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "opentelemetry-instrumentation-celery>=0.66b1",
    "supportcore",
]

[tool.uv.sources]
supportcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportworker"]
