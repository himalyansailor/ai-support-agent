[project]
name = "supportapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "python-multipart>=0.0.20",
    "supportcore",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
supportcore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supportapi"]
