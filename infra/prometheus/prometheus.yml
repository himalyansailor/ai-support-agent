global:
  scrape_interval: 15s
scrape_configs:
  - job_name: support-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
    # /metrics carries per-organisation labels. When the API runs with SUPPORT_METRICS_TOKEN
    # set (required to expose metrics in prod), send the same value as a bearer token:
    # authorization:
    #   type: Bearer
    #   credentials: <SUPPORT_METRICS_TOKEN>
    # (older Prometheus: bearer_token: <SUPPORT_METRICS_TOKEN>)
  - job_name: support-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9101"]
