apiVersion: 1
# These datasources were first provisioned without a uid. Deleting by name lets Grafana re-create them
# with the fixed uids the dashboards use (otherwise an existing Grafana database fails to start).
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Jaeger
    orgId: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 500
      derivedFields:
        # trace_id is a JSON field of each log line (not a label): the link opens the trace in Jaeger.
        - name: trace_id
          datasourceUid: jaeger
          matcherType: regex
          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'
          url: "$${__value.raw}"
          urlDisplayLabel: Open in Jaeger
