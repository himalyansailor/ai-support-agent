# Single-process Loki for local dev: filesystem storage, 7-day retention, small caches (mem_limit 256m).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h  # 7 days
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  max_global_streams_per_user: 2000
  max_query_parallelism: 2
  split_queries_by_interval: 24h
  volume_enabled: true
  discover_service_name: []  # no automatic service_name label: streams carry only service and level
  discover_log_levels: false  # no detected_level metadata either

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 20

chunk_store_config:
  chunk_cache_config:
    embedded_cache:
      enabled: true
      max_size_mb: 20

ingester:
  chunk_idle_period: 30m
  max_chunk_age: 2h
  chunk_target_size: 524288
  wal:
    dir: /loki/wal

analytics:
  reporting_enabled: false
